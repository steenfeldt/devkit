name: Dashboard
on:
  push:
    paths: ['frontend/**', 'web/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'web/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global pnpm@10.33.0
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - name: Verify committed production assets
        run: git diff --exit-code -- web/dist
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend test:ui
